input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }

  # Add timestamp
  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS" ]
    target => "@timestamp"
  }

  # Always set a service_name default so the index name is never malformed.
  mutate {
    add_field => { "service_name" => "unknown" }
  }
  if [spring_app_name] {
    mutate {
      replace => { "service_name" => "%{spring_app_name}" }
    }
  }

  mutate {
    add_field => {
      "environment" => "${LOG_ENVIRONMENT:development}"
      "log_type" => "application"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microservices-%{service_name}-%{+YYYY.MM.dd}"
    user => "${ELASTIC_USERNAME:elastic}"
    password => "${ELASTIC_PASSWORD:changeme}"
  }
  stdout {
    codec => rubydebug
  }
}