server:
  port: 8084

spring:
  config:
    import: optional:file:services/search-service/.env[.properties]
  application:
    name: search-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # Default to dev profile
  # Elasticsearch Configuration
  elasticsearch:
    uris: http://localhost:9200
    username: elastic
    password: '123456'
  #=========================== Kafka Configurations ===========================
  kafka:
    bootstrap-servers: localhost:29092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: search-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring:
          deserializer:
            value:
              delegate:
                class: org.springframework.kafka.support.serializer.JsonDeserializer
          json:
            trusted:
              packages: '*'

management:
  tracing:
    sampling:
      probability: 1.0

# In application.properties
logging:
#  config: classpath:logback-spring-prod.xml
  level:
    org:
      springframework:
        kafka: WARN
      apache:
        kafka: WARN

# Eureka Configuration - DISABLED by default for local development
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}  # Disabled by default
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

#elk stack
logstash:
  host: localhost
  port: 5000
# Enable Spring property resolution in Logback

---
# Docker/Production Profile - Eureka ENABLED
spring:
  config:
    activate:
      on-profile: docker
  # Elasticsearch Docker configuration
  elasticsearch:
    uris: http://elasticsearch:9200
    username: elastic
    password: '123456'
    socket-timeout: 10s
    connection-timeout: 5s
    restclient:
      sniffer:
        interval: 5m
  # Defer index creation to avoid startup failures
  data:
    elasticsearch:
      repositories:
        enabled: true
  kafka:
    bootstrap-servers: kafka:9092

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka/  # Docker DNS name
  instance:
    prefer-ip-address: true
    hostname: search-service

# ELK Stack - Use Docker service name
logstash:
  host: logstash
  port: 5000



---
# ELK opt-in profile.
# Activate alongside any other profile to ship logs to Logstash, e.g.
#   from IntelliJ:  -Dspring.profiles.active=dev,elk
# Defined as a separate profile so local runs stay quiet by default.
spring:
  config:
    activate:
      on-profile: elk
logstash:
  host: ${LOGSTASH_HOST:localhost}
  port: ${LOGSTASH_PORT:5000}
