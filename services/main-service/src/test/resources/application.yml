#configuring h2 database for testing purposes
spring:
  datasource:
    url: jdbc:h2:mem:testing;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  liquibase:
    enabled: false
  # No broker runs during tests; this only satisfies the @Value placeholder in KafkaConfig.
  # KafkaAdmin logs and moves on when the broker is unreachable, so the context still loads.
  kafka:
    bootstrap-servers: localhost:29092

# No registry during tests; without this the context spends ~25s retrying Eureka.
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# No MinIO runs during tests either; these only satisfy the placeholders in MinioConfig.
minio:
  endpoint: http://localhost:9000
  access-key: testAccessKey
  secret-key: testSecretKey
  bucket-name: test-bucket
  auto-create-bucket: false

# File upload directory for testing
file:
  upload-dir: target/test-uploads/

# JWT configuration for testing (using dummy values)
app:
  jwtSecret: testSecretKeyForTesting123456789012345678901234567890
  jwtExpirationMs: 86400000

token:
  signing:
    key: testSigningKeyForTesting123456789012345678901234567890

# Encryption key for testing
encryption:
  key: testEncryptionKey123456789012345678901234567890
